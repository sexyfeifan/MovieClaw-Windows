[[permission]]
identifier = "allow-save-server-url"
description = "Allows saving the server URL to config"
commands.allow = ["save_server_url"]

[[permission]]
identifier = "allow-load-server-url"
description = "Allows loading the server URL from config"
commands.allow = ["load_server_url"]

[[permission]]
identifier = "allow-clear-server-url"
description = "Allows clearing the saved server URL"
commands.allow = ["clear_server_url"]

[[permission]]
identifier = "allow-probe-server"
description = "Allows probing a server for health check"
commands.allow = ["probe_server"]

[[permission]]
identifier = "allow-check-for-updates"
description = "Allows checking for software updates from GitHub"
commands.allow = ["check_for_updates"]

[[permission]]
identifier = "allow-open-download-page"
description = "Allows opening the download page in browser"
commands.allow = ["open_download_page"]

[[permission]]
identifier = "allow-open-release-page"
description = "Allows opening the release page in browser"
commands.allow = ["open_release_page"]

[[permission]]
identifier = "allow-proxy-api"
description = "Allows proxying API requests to the MovieClaw server"
commands.allow = ["proxy_api"]

[[permission]]
identifier = "allow-get-server-url"
description = "Allows reading the configured server URL"
commands.allow = ["get_server_url"]

[[permission]]
identifier = "allow-has-embedded-player"
description = "Allows checking whether an embedded mpv player is available"
commands.allow = ["has_embedded_player"]

[[permission]]
identifier = "allow-launch-embedded-player"
description = "Allows launching the embedded mpv player"
commands.allow = ["launch_embedded_player"]

[[permission]]
identifier = "allow-resize-embedded-player"
description = "Allows resizing the embedded player window"
commands.allow = ["resize_embedded_player"]

[[permission]]
identifier = "allow-set-embedded-player-visible"
description = "Allows showing/hiding the embedded player"
commands.allow = ["set_embedded_player_visible"]

[[permission]]
identifier = "allow-stop-embedded-player"
description = "Allows stopping the embedded player"
commands.allow = ["stop_embedded_player"]

[[permission]]
identifier = "allow-send-mpv-command-embedded"
description = "Allows sending commands to the embedded mpv player"
commands.allow = ["send_mpv_command_embedded"]

[[permission]]
identifier = "allow-get-main-window-hwnd"
description = "Allows getting the main window handle for embedding"
commands.allow = ["get_main_window_hwnd"]

[[permission]]
identifier = "allow-discover-servers"
description = "Allows discovering MovieClaw servers on the local network"
commands.allow = ["discover_servers"]

[[permission]]
identifier = "default"
description = "Default permissions for MovieClaw Desktop"
permissions = [
    "allow-save-server-url",
    "allow-load-server-url",
    "allow-clear-server-url",
    "allow-probe-server",
    "allow-check-for-updates",
    "allow-open-download-page",
    "allow-open-release-page",
    "allow-proxy-api",
    "allow-get-server-url",
    "allow-has-embedded-player",
    "allow-launch-embedded-player",
    "allow-resize-embedded-player",
    "allow-set-embedded-player-visible",
    "allow-stop-embedded-player",
    "allow-send-mpv-command-embedded",
    "allow-get-main-window-hwnd",
    "allow-discover-servers"
]

[[permission]]
identifier = "allow-cancel-proxy-request"
description = "Allows cancel_proxy_request"
commands.allow = ["cancel_proxy_request"]

[[permission]]
identifier = "allow-complete-shutdown"
description = "Allows complete_shutdown"
commands.allow = ["complete_shutdown"]

[[permission]]
identifier = "allow-get-app-version"
description = "Allows get_app_version"
commands.allow = ["get_app_version"]

[[permission]]
identifier = "allow-get-embedded-player-status"
description = "Allows get_embedded_player_status"
commands.allow = ["get_embedded_player_status"]
