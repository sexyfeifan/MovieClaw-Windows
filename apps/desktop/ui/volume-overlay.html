<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: transparent;
  user-select: none;
  -webkit-user-select: none;
  font-family: 'Segoe UI', system-ui, sans-serif;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
}
.container {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(15, 17, 23, 0.92);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 10px 14px;
  color: #e8e8e8;
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
}
button {
  width: 34px; height: 34px;
  border: none; border-radius: 8px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  background: rgba(255,255,255,0.1);
  color: #e8e8e8;
  transition: background 0.15s;
}
button:hover { background: rgba(255,255,255,0.2); }
button:active { background: rgba(255,255,255,0.3); }
button.muted { background: rgba(248,113,113,0.5); }
input[type=range] {
  -webkit-appearance: none;
  width: 100px; height: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,0.15);
  outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff; cursor: pointer;
}
.pct {
  font-size: 12px;
  min-width: 36px;
  text-align: center;
  opacity: 0.8;
  font-weight: 600;
  letter-spacing: 0.3px;
}
</style>
</head>
<body>
  <div class="container">
    <button id="btnMute" title="静音 (M)">🔊</button>
    <button id="btnDown" title="音量减">−</button>
    <input type="range" id="slider" min="0" max="130" value="100" step="1">
    <button id="btnUp" title="音量加">+</button>
    <span class="pct" id="pct">100%</span>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;

    let volume = 100;
    let muted = false;

    function updateUI() {
      document.getElementById('slider').value = volume;
      document.getElementById('pct').textContent = volume + '%';
      const muteBtn = document.getElementById('btnMute');
      muteBtn.textContent = muted ? '🔇' : '🔊';
      muteBtn.classList.toggle('muted', muted);
    }

    async function sendCmd(cmd) {
      try {
        await invoke('send_mpv_command', { command: cmd });
      } catch (e) {
        console.error('send_mpv_command failed:', e);
      }
    }

    document.getElementById('btnMute').addEventListener('click', async () => {
      muted = !muted;
      await sendCmd(['set_property', 'mute', muted]);
      updateUI();
    });

    document.getElementById('btnDown').addEventListener('click', async () => {
      volume = Math.max(0, volume - 5);
      await sendCmd(['set_property', 'volume', volume]);
      updateUI();
    });

    document.getElementById('btnUp').addEventListener('click', async () => {
      volume = Math.min(130, volume + 5);
      await sendCmd(['set_property', 'volume', volume]);
      updateUI();
    });

    document.getElementById('slider').addEventListener('input', async (e) => {
      volume = parseInt(e.target.value, 10);
      await sendCmd(['set_property', 'volume', volume]);
      updateUI();
    });

    // Listen for state updates from main window
    if (window.__TAURI__.event) {
      window.__TAURI__.event.listen('player_state', (e) => {
        const p = e.payload;
        if (typeof p.volume === 'number') volume = Math.round(p.volume);
        if (typeof p.mute === 'boolean') muted = p.mute;
        updateUI();
      });
    }

    updateUI();
  </script>
</body>
</html>
