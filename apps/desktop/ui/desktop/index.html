<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieClaw</title>
<link rel="stylesheet" href="desktop.css">
</head>
<body>
  <!-- 窗口标题栏 -->
  <header class="titlebar" data-tauri-drag-region>
    <div class="titlebar-title">MovieClaw</div>
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="btnMinimize" title="最小化">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5.5" width="12" height="1" fill="currentColor"/></svg>
      </button>
      <button class="titlebar-btn" id="btnMaximize" title="最大化">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" rx="1" stroke="currentColor" stroke-width="1" fill="none"/></svg>
      </button>
      <button class="titlebar-btn titlebar-close" id="btnClose" title="关闭">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div class="app-layout">
    <!-- 侧栏 -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-search">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" placeholder="搜索片名、演员、导演" id="searchInput" autocomplete="off">
      </div>

      <div class="sidebar-nav">
        <div class="nav-section">
          <a class="nav-item active" data-page="home" href="#">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V9.5"/></svg>
            <span>首页</span>
          </a>
          <a class="nav-item" data-page="favorites" href="#">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
            <span>我的收藏</span>
          </a>
        </div>

        <div class="nav-section">
          <div class="nav-section-label">媒体库</div>
          <div id="libraryNav">
            <!-- 动态填充 -->
          </div>
        </div>

        <div class="nav-section">
          <div class="nav-section-label">合集</div>
          <div id="collectionNav">
            <!-- 动态填充 -->
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <a class="nav-item" data-page="settings" href="#">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span>设置</span>
        </a>
      </div>
    </nav>

    <!-- 内容区 -->
    <main class="content" id="content">
      <!-- 页面内容动态加载 -->
      <div class="page-loading">
        <div class="spinner"></div>
      </div>
    </main>
  </div>

  <!-- 播放启动覆盖层 -->
  <div class="player-overlay" id="playerOverlay" hidden>
    <div class="player-overlay-bg"></div>
    <div class="player-overlay-info">
      <div class="player-overlay-title" id="playerTitle"></div>
      <div class="player-overlay-status">正在启动播放器...</div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
