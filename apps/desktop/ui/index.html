<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieClaw</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">🎬</span>
      <span class="logo-text">MovieClaw</span>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item active" data-page="library" onclick="navigate('library')">
        <span class="nav-icon">🏠</span> 媒体库
      </a>
      <a class="nav-item" data-page="movies" onclick="navigate('movies')">
        <span class="nav-icon">🎬</span> 电影
      </a>
      <a class="nav-item" data-page="series" onclick="navigate('series')">
        <span class="nav-icon">📺</span> 剧集
      </a>
      <a class="nav-item" data-page="search" onclick="navigate('search')">
        <span class="nav-icon">🔍</span> 搜索
      </a>
      <div class="nav-divider"></div>
      <a class="nav-item" data-page="settings" onclick="navigate('settings')">
        <span class="nav-icon">⚙️</span> 设置
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="server-status" id="serverStatus">
        <span class="status-dot disconnected"></span>
        <span class="status-text">未连接</span>
      </div>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="content" id="content">
    <!-- 顶部搜索栏 -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-icon" onclick="goBack()" id="btnBack" style="display:none">←</button>
        <h2 class="page-title" id="pageTitle">媒体库</h2>
      </div>
      <div class="topbar-right">
        <div class="search-box" id="searchBox">
          <input type="text" placeholder="搜索电影、剧集..." id="searchInput"
                 onkeydown="if(event.key==='Enter')doSearch()">
          <button class="btn-icon" onclick="doSearch()">🔍</button>
        </div>
      </div>
    </header>

    <!-- 页面容器 -->
    <div class="page-container" id="pageContainer">
      <!-- 媒体库 -->
      <div class="page active" id="page-library">
        <div class="section-title">最近添加</div>
        <div class="media-grid" id="gridRecent"></div>
        <div class="section-title">继续观看</div>
        <div class="media-grid" id="gridContinue"></div>
      </div>

      <!-- 电影 -->
      <div class="page" id="page-movies">
        <div class="filter-bar">
          <button class="filter-btn active" onclick="filterMovies('all',this)">全部</button>
          <button class="filter-btn" onclick="filterMovies('recent',this)">最近</button>
          <button class="filter-btn" onclick="filterMovies('popular',this)">热门</button>
        </div>
        <div class="media-grid" id="gridMovies"></div>
      </div>

      <!-- 剧集 -->
      <div class="page" id="page-series">
        <div class="media-grid" id="gridSeries"></div>
      </div>

      <!-- 搜索 -->
      <div class="page" id="page-search">
        <div class="search-results" id="searchResults">
          <div class="empty-state">输入关键词搜索电影或剧集</div>
        </div>
      </div>

      <!-- 详情 -->
      <div class="page" id="page-detail">
        <div class="detail-container" id="detailContainer"></div>
      </div>

      <!-- 设置 -->
      <div class="page" id="page-settings">
        <div class="settings-container">
          <div class="settings-group">
            <h3>服务器</h3>
            <div class="setting-item">
              <label>服务器地址</label>
              <div class="setting-control">
                <input type="text" id="settingServerUrl" placeholder="http://...">
                <button class="btn-primary" onclick="saveServerUrl()">保存</button>
              </div>
            </div>
            <div class="setting-item">
              <label>连接状态</label>
              <div class="setting-control">
                <span id="settingConnStatus">-</span>
                <button class="btn-secondary" onclick="testConnection()">测试连接</button>
              </div>
            </div>
          </div>
          <div class="settings-group">
            <h3>播放</h3>
            <div class="setting-item">
              <label>硬件解码</label>
              <div class="setting-control">
                <select id="settingHwdec">
                  <option value="auto-safe">自动 (推荐)</option>
                  <option value="auto">自动 (全部)</option>
                  <option value="no">关闭</option>
                </select>
              </div>
            </div>
            <div class="setting-item">
              <label>音量</label>
              <div class="setting-control">
                <input type="range" id="settingVolume" min="0" max="130" value="100"
                       oninput="document.getElementById('volLabel').textContent=this.value+'%'">
                <span id="volLabel">100%</span>
              </div>
            </div>
          </div>
          <div class="settings-group">
            <h3>关于</h3>
            <div class="setting-item">
              <label>版本</label>
              <div class="setting-control">
                <span id="appVersion">0.1.0</span>
                <button class="btn-secondary" onclick="checkUpdate()">检查更新</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 播放器浮层 -->
  <div class="player-overlay" id="playerOverlay" style="display:none">
    <div class="player-container">
      <div class="player-header">
        <span class="player-title" id="playerTitle">正在播放</span>
        <button class="btn-icon" onclick="closePlayer()">✕</button>
      </div>
      <div class="player-body">
        <div class="player-visual">
          <div class="player-icon">▶</div>
          <div class="player-status" id="playerStatus">播放中...</div>
        </div>
      </div>
      <div class="player-controls">
        <div class="player-progress">
          <span class="time" id="playerCurTime">00:00</span>
          <div class="progress-bar" onclick="playerSeek(event)">
            <div class="progress-fill" id="playerProgressFill"></div>
          </div>
          <span class="time" id="playerTotalTime">00:00</span>
        </div>
        <div class="player-buttons">
          <button class="ctrl-btn" onclick="playerSeekRel(-30)">⏪</button>
          <button class="ctrl-btn" onclick="playerSeekRel(-10)">◀◀</button>
          <button class="ctrl-btn primary" id="playerBtnPause" onclick="playerTogglePause()">⏸</button>
          <button class="ctrl-btn" onclick="playerSeekRel(10)">▶▶</button>
          <button class="ctrl-btn" onclick="playerSeekRel(30)">⏩</button>
          <button class="ctrl-btn danger" onclick="closePlayer()">⏹</button>
        </div>
        <div class="player-volume">
          <button class="vol-btn" id="playerVolIcon" onclick="playerToggleMute()">🔊</button>
          <input type="range" class="vol-slider" id="playerVolSlider"
                 min="0" max="130" value="100" oninput="playerSetVolume(this.value)">
          <span class="vol-pct" id="playerVolPct">100%</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 更新提示 -->
  <div class="update-banner" id="updateBanner" style="display:none">
    <div class="update-content">
      <div class="update-title">🔄 发现新版本 <span id="updateVersion"></span></div>
      <div class="update-msg" id="updateMessage"></div>
      <div class="update-actions">
        <button class="btn-primary" onclick="openDownload()">立即更新</button>
        <button class="btn-ghost" onclick="dismissUpdate()">稍后</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
