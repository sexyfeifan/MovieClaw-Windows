name: Upstream Watch

on:
  schedule:
    # Every Monday, 16:17 China Standard Time.
    - cron: '17 8 * * 1'
  workflow_dispatch:
  push:
    branches: [main, feat/windows-native, 'codex/**']
    paths: ['.github/workflows/upstream-watch.yml', 'apps/desktop/upstream-baseline.json', 'apps/desktop/scripts/upstream-diff.cjs']
  pull_request:
    paths: ['.github/workflows/upstream-watch.yml', 'apps/desktop/upstream-baseline.json', 'apps/desktop/scripts/upstream-diff.cjs']

permissions:
  contents: read

jobs:
  check-upstream:
    name: Compare pinned macOS baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Fetch the official baseline and latest main trees
        env:
          UPSTREAM_CHECKOUT: ${{ runner.temp }}/movieclaw-upstream
        run: |
          UPSTREAM_REPOSITORY=$(node -p "require('./apps/desktop/upstream-baseline.json').repository")
          UPSTREAM_BASELINE=$(node -p "require('./apps/desktop/upstream-baseline.json').revision")
          git init "$UPSTREAM_CHECKOUT"
          git -C "$UPSTREAM_CHECKOUT" remote add origin "https://github.com/$UPSTREAM_REPOSITORY.git"
          git -C "$UPSTREAM_CHECKOUT" fetch --filter=blob:none --depth=1 origin main:refs/remotes/origin/main
          git -C "$UPSTREAM_CHECKOUT" fetch --filter=blob:none --depth=1 origin "$UPSTREAM_BASELINE"
      - name: Compare all tracked files and write review report
        run: |
          node apps/desktop/scripts/upstream-diff.cjs --repository-dir "${{ runner.temp }}/movieclaw-upstream" --output upstream-report
          cat upstream-report/upstream-diff.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: movieclaw-upstream-comparison
          path: upstream-report
          if-no-files-found: error
          retention-days: 30
