name: Desktop Release

on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require tag to match Cargo version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('apps/desktop/src-tauri/Cargo.toml').read_text())['package']['version']
          assert os.environ['RELEASE_TAG'] == f'desktop-v{version}', 'Desktop release tag must match Cargo.toml'
          PY
  verify:
    needs: version
    uses: ./.github/workflows/desktop-ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-packages-${{ github.sha }}
          path: dist
      - name: Verify and publish the tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" MovieClaw-Desktop-*-Setup-x64.exe MovieClaw-Desktop-*-portable-x64.zip SHA256SUMS.txt --verify-tag --title "MovieClaw Desktop $RELEASE_TAG" --generate-notes
