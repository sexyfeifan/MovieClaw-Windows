name: Desktop Release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Desktop tag matching the selected source version
        required: true
        type: string
      validation_policy:
        description: Publish CI-verified packages with disclosed limitations, or require full signed hardware acceptance
        required: true
        default: signed-hardware
        type: choice
        options: [signed-hardware, ci-verified]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require tag to match Cargo version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('apps/desktop/src-tauri/Cargo.toml').read_text())['package']['version']
          assert os.environ['RELEASE_TAG'] == f'desktop-v{version}', 'Desktop release tag must match Cargo.toml'
          PY
  verify:
    if: github.event_name == 'push'
    needs: version
    uses: ./.github/workflows/desktop-ci.yml
  publish:
    needs: [version, verify]
    if: always() && needs.version.result == 'success' && (needs.verify.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Require a successful CI run for the exact physically tested source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACCEPTANCE_RUN_ID: ${{ vars.DESKTOP_ACCEPTANCE_RUN_ID }}
        run: |
          test -n "$ACCEPTANCE_RUN_ID" || { echo 'Stable release requires DESKTOP_ACCEPTANCE_RUN_ID for the physically tested packages'; exit 1; }
          gh api "repos/$GH_REPO/actions/runs/$ACCEPTANCE_RUN_ID" > acceptance-run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('acceptance-run.json'))
          assert run['conclusion'] == 'success' and run['head_sha'] == os.environ['GITHUB_SHA'], 'Acceptance CI must pass for the exact release commit'
          assert run['path'] == '.github/workflows/desktop-ci.yml', 'Acceptance must come from Desktop CI'
          assert run['event'] == 'push', 'Acceptance artifacts must be built from the exact pushed commit, not a PR merge tree'
          assert run['head_repository']['full_name'] == os.environ['GH_REPO'], 'Fork artifacts are not release inputs'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: desktop-packages-${{ github.sha }}
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ vars.DESKTOP_ACCEPTANCE_RUN_ID }}
      - name: Physical acceptance and signature gate
        if: inputs.validation_policy != 'ci-verified'
        env:
          DESKTOP_HARDWARE_ACCEPTANCE_JSON: ${{ vars.DESKTOP_HARDWARE_ACCEPTANCE_JSON }}
        run: |
          VERSION=$(python3 -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('apps/desktop/src-tauri/Cargo.toml').read_text())['package']['version'])")
          python3 apps/desktop/scripts/check-release-evidence.py --directory dist --revision "$GITHUB_SHA" --version "$VERSION"
      - name: CI packages and disclosed limitations gate
        if: inputs.validation_policy == 'ci-verified'
        run: |
          VERSION=$(python3 -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('apps/desktop/src-tauri/Cargo.toml').read_text())['package']['version'])")
          python3 apps/desktop/scripts/check-release-evidence.py --directory dist --revision "$GITHUB_SHA" --version "$VERSION" --policy ci-verified --notes "docs/changelog/desktop-v$VERSION.md"
      - name: Verify and publish the tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
          VERSION=$(python3 -c "import json; print(json.load(open('release-manifest.json', encoding='utf-8-sig'))['version'])")
          gh release create "$RELEASE_TAG" MovieClaw-Desktop-*-Setup-x64.exe MovieClaw-Desktop-*-portable-x64.zip SHA256SUMS.txt release-manifest.json --target "$GITHUB_SHA" --latest --title "MovieClaw Windows $VERSION" --notes-file "../docs/changelog/desktop-v$VERSION.md"
